<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<!-- FIX: maximum-scale=1 でiOSのフォーカス時自動ズームを完全防止 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Routine">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#16181A">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect fill='%2316181A' width='100' height='100' rx='22'/%3E%3Cpath d='M28 52 L44 68 L74 34' stroke='%23F4F3F0' stroke-width='8' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>Routine — 業務チェック</title>
<style>
/* ============================================================
   ROUTINE  —  Daily Operations Checklist
   Design: Ink & Paper. 高級文具のような静かな精度。
   Palette:
     --ink    #16181A  主色（墨）
     --coal   #2B2E31  補助
     --paper  #F4F3F0  背景（生成り）
     --card   #FFFFFF  カード
     --line   #E4E2DD  罫線
     --muted  #8F8D89  弱い文字
============================================================ */
:root {
  --ink:   #16181A;
  --coal:  #2B2E31;
  --paper: #F4F3F0;
  --card:  #FFFFFF;
  --line:  #E4E2DD;
  --muted: #8F8D89;
  --danger:#B3261E;
  --radius: 14px;
  --shadow: 0 1px 2px rgba(22,24,26,.05), 0 4px 16px rgba(22,24,26,.06);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
}

input, textarea {
  -webkit-user-select: text;
  user-select: text;
}

/* キーボード操作時のフォーカス可視化 */
input:focus-visible, button:focus-visible {
  outline: 2px solid var(--ink);
  outline-offset: 2px;
}

html { height: 100%; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Helvetica Neue", sans-serif;
  background: var(--paper);
  min-height: 100vh;
  color: var(--ink);
  line-height: 1.6;
  letter-spacing: 0.01em;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
  touch-action: manipulation; /* ダブルタップズーム防止 */
  -webkit-font-smoothing: antialiased;
}

/* ============================================================
   共通：数字はタブラー字形で桁を揃える
============================================================ */
.num { font-variant-numeric: tabular-nums; }

/* ============================================================
   ヘッダー = デートプレート（このアプリの顔）
============================================================ */
header {
  padding: 40px 24px 20px;
  text-align: center;
}

.eyebrow {
  font-size: 0.68rem;
  font-weight: 600;
  letter-spacing: 0.32em;
  text-indent: 0.32em; /* 中央揃え補正 */
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 10px;
}

.date-plate {
  font-size: 1.7rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  color: var(--ink);
  line-height: 1.3;
}

.date-plate .weekday {
  font-size: 1.05rem;
  font-weight: 500;
  color: var(--muted);
  margin-left: 10px;
}

.header-rule {
  width: 40px;
  height: 2px;
  background: var(--ink);
  margin: 16px auto 0;
  border-radius: 1px;
}

/* ============================================================
   レイアウト
============================================================ */
.container {
  max-width: 560px;
  margin: 0 auto;
  padding: 0 20px 130px;
}

/* ============================================================
   シフト選択画面
============================================================ */
.shift-select-screen { padding: 16px 0 40px; }

.select-title {
  text-align: center;
  font-size: 0.95rem;
  font-weight: 500;
  color: var(--muted);
  margin-bottom: 20px;
}

.shift-buttons {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.shift-btn {
  padding: 20px 22px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  font-size: 1.05rem;
  font-weight: 600;
  font-family: inherit;
  color: var(--ink);
  cursor: pointer;
  text-align: left;
  display: flex;
  justify-content: space-between;
  align-items: center;
  transition: transform 0.12s ease, box-shadow 0.12s ease;
}

.shift-btn:active {
  transform: scale(0.985);
  box-shadow: 0 1px 2px rgba(22,24,26,.08);
}

.shift-btn .time {
  font-size: 0.88rem;
  color: var(--muted);
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}

.add-shift-btn {
  padding: 17px 22px;
  background: transparent;
  border: 1.5px dashed #C9C6C0;
  border-radius: var(--radius);
  font-size: 0.95rem;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  text-align: center;
  color: var(--coal);
  transition: background 0.12s;
  margin-top: 10px;
}
.add-shift-btn:active { background: #ECEAE5; }

.manage-shifts-btn {
  padding: 13px 22px;
  background: transparent;
  border: none;
  font-size: 0.85rem;
  font-family: inherit;
  cursor: pointer;
  text-align: center;
  color: var(--muted);
  text-decoration: underline;
  text-underline-offset: 3px;
  margin-top: 18px;
  width: 100%;
}

/* ============================================================
   メイン画面
============================================================ */
.main-screen { display: none; }
.main-screen.active { display: block; }

.shift-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 18px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--line);
}

.current-shift {
  font-size: 1.25rem;
  font-weight: 700;
  letter-spacing: 0.02em;
}

.current-shift-time {
  font-size: 0.85rem;
  color: var(--muted);
  font-weight: 500;
  margin-left: 10px;
  font-variant-numeric: tabular-nums;
}

.change-btn {
  padding: 8px 14px;
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 8px;
  font-size: 0.8rem;
  font-family: inherit;
  color: var(--coal);
  cursor: pointer;
}
.change-btn:active { background: #ECEAE5; }

/* ============================================================
   進捗 — ヘアラインバー + タブラー数字
============================================================ */
.progress-section { margin-bottom: 22px; }

.progress-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 8px;
}

.progress-label {
  font-size: 0.68rem;
  font-weight: 600;
  letter-spacing: 0.22em;
  color: var(--muted);
  text-transform: uppercase;
}

.progress-text {
  font-size: 0.95rem;
  color: var(--ink);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.progress-bar {
  height: 3px;
  background: #DDDAD4;
  border-radius: 2px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: var(--ink);
  transition: width 0.35s cubic-bezier(.4,0,.2,1);
}

/* ============================================================
   チェックリスト
============================================================ */
.checklist {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.checklist-item {
  display: flex;
  align-items: center;
  padding: 17px 16px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  gap: 14px;
  transition: background 0.15s, border-color 0.15s, opacity 0.15s;
  cursor: pointer;
}

.checklist-item.checked {
  background: #EFEDE8;
  border-color: transparent;
}

.checklist-item .item-text {
  flex: 1;
  font-size: 0.95rem;
  font-weight: 500;
}

.checklist-item.checked .item-text {
  color: var(--muted);
  text-decoration: line-through;
  text-decoration-thickness: 1px;
}

@keyframes popBounce {
  0%   { transform: scale(1); }
  35%  { transform: scale(1.06); }
  100% { transform: scale(1); }
}
.checklist-item.pop-animation { animation: popBounce 0.25s ease-out; }

.custom-checkbox {
  position: relative;
  width: 26px;
  height: 26px;
  flex-shrink: 0;
}

.custom-checkbox input {
  position: absolute;
  opacity: 0;
  width: 100%;
  height: 100%;
  cursor: pointer;
  z-index: 2;
  margin: 0;
}

.checkmark {
  position: absolute;
  inset: 0;
  background: var(--card);
  border: 1.5px solid #C9C6C0;
  border-radius: 8px;
  pointer-events: none;
  transition: background 0.15s, border-color 0.15s;
}

.custom-checkbox input:checked + .checkmark {
  background: var(--ink);
  border-color: var(--ink);
}

.custom-checkbox input:checked + .checkmark::after {
  content: "";
  position: absolute;
  left: 8.5px;
  top: 4px;
  width: 6px;
  height: 12px;
  border: solid #fff;
  border-width: 0 2px 2px 0;
  transform: rotate(45deg);
}

.day-badge {
  font-size: 0.68rem;
  font-weight: 600;
  padding: 3px 9px;
  background: #ECEAE5;
  color: var(--muted);
  border-radius: 5px;
  white-space: nowrap;
  flex-shrink: 0;
  letter-spacing: 0.04em;
}

/* ============================================================
   完了ボタン
============================================================ */
.complete-btn {
  width: 100%;
  padding: 18px;
  background: var(--ink);
  color: #fff;
  border: none;
  border-radius: var(--radius);
  font-size: 1rem;
  font-weight: 700;
  font-family: inherit;
  letter-spacing: 0.08em;
  margin-top: 22px;
  cursor: pointer;
  transition: transform 0.12s, opacity 0.12s;
  box-shadow: var(--shadow);
}

.complete-btn:disabled {
  background: #DDDAD4;
  color: #A5A29C;
  cursor: not-allowed;
  box-shadow: none;
}

.complete-btn:not(:disabled):active { transform: scale(0.985); }

/* ============================================================
   完了済み表示
============================================================ */
.already-completed {
  background: var(--card);
  border: 1px solid var(--line);
  padding: 28px 20px;
  border-radius: var(--radius);
  text-align: center;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
  font-weight: 600;
}

.already-completed .sub {
  display: block;
  font-size: 0.82rem;
  color: var(--muted);
  font-weight: 400;
  margin-top: 4px;
}

.undo-btn {
  margin-top: 16px;
  font-size: 0.82rem;
  font-family: inherit;
  background: transparent;
  border: 1px solid var(--line);
  color: var(--coal);
  padding: 9px 18px;
  border-radius: 8px;
  cursor: pointer;
}

/* ============================================================
   ナビゲーション（下部タブ）
============================================================ */
.nav-tabs {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: rgba(244,243,240,0.92);
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
  border-top: 1px solid var(--line);
  display: flex;
  justify-content: space-around;
  padding: 10px 12px;
  z-index: 100;
  padding-bottom: calc(10px + env(safe-area-inset-bottom));
}

.tab {
  flex: 1;
  max-width: 140px;
  padding: 11px 0;
  background: transparent;
  border: none;
  font-size: 0.85rem;
  font-weight: 600;
  font-family: inherit;
  color: var(--muted);
  border-radius: 10px;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}

.tab.active {
  background: var(--ink);
  color: #fff;
}

/* ============================================================
   パネル
============================================================ */
.panel { display: none; }
.panel.active { display: block; }

.section-label {
  font-size: 0.68rem;
  font-weight: 600;
  letter-spacing: 0.22em;
  color: var(--muted);
  text-transform: uppercase;
  margin: 26px 0 12px;
}

/* ============================================================
   編集画面
============================================================ */
.edit-shift-tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 18px;
  flex-wrap: wrap;
}

.edit-shift-tab {
  padding: 9px 16px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 9px;
  font-size: 0.85rem;
  font-weight: 600;
  font-family: inherit;
  color: var(--coal);
  cursor: pointer;
}

.edit-shift-tab.active {
  background: var(--ink);
  color: #fff;
  border-color: var(--ink);
}

.add-item-section {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px 16px;
  box-shadow: var(--shadow);
}

/* すべての入力欄：iOSズーム防止のため font-size 16px 以上厳守 */
.add-item-section input[type="text"] {
  width: 100%;
  padding: 15px 14px;
  border: 1.5px solid var(--line);
  border-radius: 10px;
  font-size: 16px;
  font-family: inherit;
  color: var(--ink);
  background: var(--paper);
  min-height: 52px;
  margin-bottom: 14px;
  -webkit-appearance: none;
  appearance: none;
}
.add-item-section input[type="text"]:focus {
  border-color: var(--ink);
  outline: none;
  background: var(--card);
}

/* 曜日ピル：選択＝墨、非選択＝薄グレー */
.day-select {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-bottom: 14px;
}

.day-select label {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 11px 0;
  min-width: 46px;
  flex: 1 0 auto;
  background: #ECEAE5;
  border: none;
  border-radius: 9px;
  font-size: 0.9rem;
  font-weight: 600;
  color: #A5A29C;
  cursor: pointer;
  transition: background 0.12s, color 0.12s;
}

.day-select input { display: none; }

.day-select label.on {
  background: var(--ink);
  color: #fff;
}

.date-input-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
  font-size: 0.88rem;
  color: var(--muted);
  font-weight: 500;
}

.date-input-row input {
  width: 74px;
  padding: 12px 8px;
  border: 1.5px solid var(--line);
  border-radius: 9px;
  font-size: 16px;
  font-family: inherit;
  text-align: center;
  background: var(--paper);
  min-height: 48px;
  -webkit-appearance: none;
  appearance: none;
  font-variant-numeric: tabular-nums;
}
.date-input-row input:focus {
  border-color: var(--ink);
  outline: none;
  background: var(--card);
}

.add-btn {
  width: 100%;
  padding: 15px;
  background: var(--ink);
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 0.95rem;
  font-weight: 700;
  font-family: inherit;
  letter-spacing: 0.06em;
  cursor: pointer;
}
.add-btn:active { opacity: 0.85; }

.edit-list { list-style: none; }

.edit-list-item {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 15px 16px;
  margin-bottom: 9px;
}

.edit-item-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
}

.edit-item-top .item-text {
  flex: 1;
  font-size: 0.93rem;
  font-weight: 500;
  word-break: break-word;
}

.edit-item-bottom {
  display: flex;
  gap: 8px;
  margin-top: 13px;
  padding-top: 13px;
  border-top: 1px solid #F0EEE9;
  flex-wrap: wrap;
}

.move-group { display: flex; gap: 6px; }
.action-group { display: flex; gap: 8px; margin-left: auto; }

.move-btn, .edit-btn {
  background: #ECEAE5;
  color: var(--coal);
  border: none;
  padding: 9px 13px;
  border-radius: 8px;
  font-size: 0.78rem;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
}

.delete-btn {
  color: var(--danger);
  background: #F7EAE9;
  border: none;
  padding: 9px 13px;
  border-radius: 8px;
  font-size: 0.78rem;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
}

/* ============================================================
   履歴
============================================================ */
.history-item {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 9px;
}

.history-date { font-weight: 700; font-size: 0.95rem; }

.history-shift {
  font-size: 0.82rem;
  color: var(--muted);
  margin: 2px 0 10px;
  font-weight: 500;
}

.history-status {
  display: flex;
  align-items: center;
  gap: 10px;
}

.badge {
  padding: 4px 11px;
  border-radius: 6px;
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.04em;
}

.badge.complete   { background: var(--ink); color: #fff; }
.badge.incomplete { background: #ECEAE5; color: var(--muted); }

.history-meta {
  font-size: 0.8rem;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}

.history-details { margin-top: 12px; }

.history-details summary {
  font-size: 0.82rem;
  color: var(--muted);
  cursor: pointer;
  font-weight: 500;
}

.history-details ul { margin-top: 8px; padding-left: 20px; }

.history-details li {
  font-size: 0.85rem;
  color: var(--muted);
  margin-bottom: 3px;
}

.history-details li.checked { color: var(--ink); }

.no-history {
  text-align: center;
  color: var(--muted);
  padding: 48px 0;
  font-size: 0.9rem;
}

/* ============================================================
   バックアップ
============================================================ */
.backup-section {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px 16px;
  margin-top: 24px;
  box-shadow: var(--shadow);
}

.backup-section h4 {
  font-size: 0.68rem;
  font-weight: 600;
  letter-spacing: 0.22em;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 14px;
}

.backup-buttons {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.backup-btn, .restore-btn {
  padding: 14px;
  border-radius: 10px;
  font-size: 0.88rem;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  text-align: center;
}

.backup-btn {
  background: var(--ink);
  color: #fff;
  border: none;
}

.restore-btn {
  background: transparent;
  color: var(--coal);
  border: 1px solid var(--line);
}

.reset-btn {
  width: 100%;
  padding: 14px;
  background: transparent;
  color: var(--danger);
  border: none;
  font-size: 0.85rem;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  margin-top: 18px;
  text-decoration: underline;
  text-underline-offset: 3px;
}

/* ============================================================
   モーダル
============================================================ */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(22,24,26,0.45);
  -webkit-backdrop-filter: blur(3px);
  backdrop-filter: blur(3px);
  z-index: 200;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal-overlay.show { display: flex; }

.modal {
  background: var(--card);
  border-radius: 18px;
  padding: 26px 22px;
  width: 100%;
  max-width: 400px;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 24px 64px rgba(22,24,26,0.25);
}

.modal h3 {
  font-size: 1.1rem;
  font-weight: 700;
  margin-bottom: 18px;
  letter-spacing: 0.02em;
}

.modal input[type="text"] {
  width: 100%;
  padding: 15px 14px;
  border: 1.5px solid var(--line);
  border-radius: 10px;
  font-size: 16px;
  font-family: inherit;
  color: var(--ink);
  background: var(--paper);
  min-height: 52px;
  margin-bottom: 14px;
  -webkit-appearance: none;
  appearance: none;
}
.modal input[type="text"]:focus {
  border-color: var(--ink);
  outline: none;
  background: var(--card);
}

/* --------------------------------------------
   iOS time入力の根本修正：
   ・-webkit-appearance:none にすると iOSで空表示になるため
     ネイティブ外観は維持しつつ高さ/整列を明示
   ・::-webkit-date-and-time-value で値の縦位置を中央に
-------------------------------------------- */
.time-field {
  flex: 1;
}
.time-field .field-label {
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--coal);
  display: block;
  margin-bottom: 7px;
}
.modal input[type="time"] {
  width: 100%;
  height: 52px;
  padding: 0 12px;
  border: 1.5px solid var(--line);
  border-radius: 10px;
  font-size: 18px;
  font-family: inherit;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
  background: var(--paper);
  display: flex;
  align-items: center;
}
.modal input[type="time"]:focus {
  border-color: var(--ink);
  outline: none;
  background: var(--card);
}
input[type="time"]::-webkit-date-and-time-value {
  text-align: left;
  line-height: 52px;
  margin: 0;
}

.modal-buttons {
  display: flex;
  gap: 10px;
  margin-top: 20px;
}

.modal-cancel, .modal-confirm {
  flex: 1;
  padding: 15px;
  border-radius: 10px;
  font-size: 0.92rem;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  border: none;
}

.modal-cancel { background: #ECEAE5; color: var(--coal); }
.modal-confirm { background: var(--ink); color: #fff; }
.modal-danger { background: var(--danger); color: #fff; }

/* ============================================================
   シフト管理
============================================================ */
.shift-manage-list { list-style: none; margin-bottom: 16px; }

.shift-manage-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px;
  background: var(--paper);
  border-radius: 10px;
  margin-bottom: 8px;
}

.shift-manage-item .shift-name { font-weight: 700; font-size: 0.95rem; }

.shift-manage-item .shift-time {
  font-size: 0.8rem;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}

.shift-manage-item .shift-actions { display: flex; gap: 8px; }

.shift-edit-btn, .shift-delete-btn {
  padding: 8px 13px;
  border: none;
  border-radius: 8px;
  font-size: 0.78rem;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
}

.shift-edit-btn { background: #ECEAE5; color: var(--coal); }
.shift-delete-btn { background: #F7EAE9; color: var(--danger); }

/* ============================================================
   完了メッセージ（フルスクリーン）
============================================================ */
.completion-message {
  display: none;
  position: fixed;
  inset: 0;
  background: var(--ink);
  z-index: 300;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  color: #fff;
}

.completion-message.show {
  display: flex;
  animation: fadeIn 0.3s;
}

.completion-message .icon {
  width: 76px;
  height: 76px;
  border: 2.5px solid #fff;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 34px;
  margin-bottom: 26px;
}

.completion-message h2 {
  font-size: 1.3rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  margin-bottom: 6px;
}

.completion-message p {
  color: rgba(255,255,255,0.6);
  font-size: 0.9rem;
}

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

/* 空状態 */
.empty-state {

.empty-state p { margin-bottom: 10px; }

  function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');

  function loadFromStorage(key, defaultValue) {
    try {
      var data = localStorage.getItem(key);
      if (data === null || data === undefined) return defaultValue;
      var parsed = JSON.parse(data);
      return (parsed !== null && parsed !== undefined) ? parsed : defaultValue;
    } catch (e) {
      console.warn('localStorage load error:', key, e);
      return defaultValue;
    }
  }

  function saveToStorage(key, value) {

      return true;

      if (e && e.name === 'QuotaExceededError') {

      if (isNaN(targetDate) || targetDate < 1 || targetDate > 31) return false;

    if (days.indexOf(todayDayName) !== -1) return true;
    return false;
  }

  function getItemDayLabel(item) {
    if (item.date) return item.date + '日';
    if (item.days && item.days.length > 0 && item.days.indexOf('毎日') === -1) {
      return item.days.join('・');
    }
    return '';
  }

  // ========================================
  // チェック状態
  // ========================================
  function getCheckKey(shiftId, itemId) {
    return getTodayKey() + '_' + shiftId + '_' + itemId;
  }

  function isItemChecked(itemId) {
    return !!state.todayChecks[getCheckKey(state.currentShift, itemId)];
  }

  function toggleItemCheck(itemId) {
    var key = getCheckKey(state.currentShift, itemId);
    state.todayChecks[key] = !state.todayChecks[key];
    saveToStorage(STORAGE_KEYS.todayChecks, state.todayChecks);

    if (window.navigator && window.navigator.vibrate) {
      try { window.navigator.vibrate(10); } catch (e) {}
    }

    /* FIX: DOM全再構築だと要素が破棄されアニメーションが再生されないため、
       該当要素のみをin-placeで更新する（描画コストも削減） */
    var el = document.querySelector('.checklist-item[data-id="' + itemId + '"]');
    if (el) {
      var checked = !!state.todayChecks[key];
      el.classList.toggle('checked', checked);
      var input = el.querySelector('input[type="checkbox"]');
      if (input) input.checked = checked;
      el.classList.remove('pop-animation');
      void el.offsetWidth; /* リフローを挟んで連続タップでもアニメを再発火 */
      el.classList.add('pop-animation');
      setTimeout(function() { el.classList.remove('pop-animation'); }, 260);
    }

    updateProgress();
  }

  function getVisibleItems() {
    if (!state.currentShift || !state.items[state.currentShift]) return [];
    return state.items[state.currentShift].filter(shouldShowItem);
  }

  function canComplete() {
    var visible = getVisibleItems();
    if (visible.length === 0) return false;
    return visible.every(function(item) { return isItemChecked(item.id); });
  }

  // ========================================
  // 日付変更検知
  // ========================================
  function checkDateChange() {
    var lastDate = localStorage.getItem(STORAGE_KEYS.lastDate);
    var today = getTodayKey();
    if (lastDate !== today) {
      localStorage.setItem(STORAGE_KEYS.lastDate, today);
      state.todayChecks = {};
      saveToStorage(STORAGE_KEYS.todayChecks, state.todayChecks);
      return true;
    }
    return false;
  }

  // ========================================
  // 完了処理
  // ========================================
  function isAlreadyCompleted() {
    var todayKey = getTodayKey();
    return state.history.some(function(record) {
      return record.dateKey === todayKey &&
             record.shiftId === state.currentShift &&
             record.allChecked === true;
    });
  }

  function completeCheck() {
    if (!canComplete()) return;

    var now = new Date();
    var visible = getVisibleItems();
    var shift = getShiftById(state.currentShift);

    var checkedItems = {};
    visible.forEach(function(item) {
      checkedItems[item.id] = { text: item.text, checked: isItemChecked(item.id) };
    });

    var record = {
      dateKey: getTodayKey(),
      date: getTodayFullString(),
      shiftId: state.currentShift,
      shiftName: shift ? shift.name : '不明',
      time: now.getHours() + ':' + ('0' + now.getMinutes()).slice(-2),
      checkedItems: checkedItems,
      allChecked: true
    };

    state.history.unshift(record);
    if (state.history.length > HISTORY_MAX) {
      state.history = state.history.slice(0, HISTORY_MAX);
    }
    saveToStorage(STORAGE_KEYS.history, state.history);
    showCompletionMessage();
  }

  function undoComplete() {
    var todayKey = getTodayKey();
    state.history = state.history.filter(function(record) {
      return !(record.dateKey === todayKey && record.shiftId === state.currentShift);
    });
    saveToStorage(STORAGE_KEYS.history, state.history);
    renderChecklist();
    updateProgress();
    updateCompletedState();
    renderHistory();
  }

  function showCompletionMessage() {
    var msg = document.getElementById('completionMessage');
    msg.classList.add('show');
    setTimeout(function() {
      msg.classList.remove('show');
      updateCompletedState();
      renderHistory();
    }, 1500);
  }

  // ========================================
  // レンダリング
  // ========================================
  function renderShiftButtons() {
    var container = document.getElementById('shiftButtons');
    container.innerHTML = '';

    if (state.shifts.length === 0) {
      container.innerHTML = '<div class="empty-state"><p>シフトがまだありません</p><p>下のボタンから追加してください</p></div>';
      return;
    }

    state.shifts.forEach(function(shift) {
      var btn = document.createElement('button');
      btn.className = 'shift-btn';

      var nameSpan = document.createElement('span');
      nameSpan.textContent = shift.name;

      var timeSpan = document.createElement('span');
      timeSpan.className = 'time';
      timeSpan.textContent = getShiftTimeString(shift);

      btn.appendChild(nameSpan);
      btn.appendChild(timeSpan);
      btn.addEventListener('click', function() { selectShift(shift.id); });
      container.appendChild(btn);
    });
  }

  function renderChecklist() {
    var container = document.getElementById('checklist');
    container.innerHTML = '';

    var visible = getVisibleItems();

    if (visible.length === 0) {
      container.innerHTML = '<p class="empty-state">本日のチェック項目はありません</p>';
      return;
    }

    visible.forEach(function(item) {
      var checked = isItemChecked(item.id);
      var dayLabel = getItemDayLabel(item);

      var div = document.createElement('div');
      div.className = 'checklist-item' + (checked ? ' checked' : '');
      div.setAttribute('data-id', item.id);

      var checkboxDiv = document.createElement('div');
      checkboxDiv.className = 'custom-checkbox';

      var input = document.createElement('input');
      input.type = 'checkbox';
      input.checked = checked;
      input.setAttribute('data-id', item.id);
      input.addEventListener('click', function(e) { e.stopPropagation(); });
      input.addEventListener('change', function(e) {
        toggleItemCheck(e.target.getAttribute('data-id'));
      });

      var checkmark = document.createElement('span');
      checkmark.className = 'checkmark';

      checkboxDiv.appendChild(input);
      checkboxDiv.appendChild(checkmark);

      var textSpan = document.createElement('span');
      textSpan.className = 'item-text';
      textSpan.textContent = item.text;

      div.appendChild(checkboxDiv);
      div.appendChild(textSpan);

      if (dayLabel) {
        var badge = document.createElement('span');
        badge.className = 'day-badge';
        badge.textContent = dayLabel;
        div.appendChild(badge);
      }

      div.addEventListener('click', function(e) {
        if (e.target.tagName === 'INPUT') return;
        toggleItemCheck(this.getAttribute('data-id'));
      });

      container.appendChild(div);
    });

    updateCompletedState();
  }

  function updateProgress() {
    var visible = getVisibleItems();
    var total = visible.length;
    var checked = visible.filter(function(item) { return isItemChecked(item.id); }).length;
    var percent = total > 0 ? (checked / total) * 100 : 0;

    document.getElementById('progressFill').style.width = percent + '%';
    document.getElementById('progressText').textContent = checked + ' / ' + total;
    document.getElementById('completeBtn').disabled = !canComplete();
  }

  function updateCompletedState() {
    var completed = isAlreadyCompleted();
    document.getElementById('alreadyCompleted').style.display = completed ? 'block' : 'none';
    document.getElementById('checklist').style.display = completed ? 'none' : 'flex';
    document.getElementById('progressSection').style.display = completed ? 'none' : 'block';
    document.getElementById('completeBtn').style.display = completed ? 'none' : 'block';
  }

  function renderEditShiftTabs() {
    var container = document.getElementById('editShiftTabs');
    container.innerHTML = '';

    if (state.shifts.length === 0) {
      container.innerHTML = '<p style="color:#8F8D89; font-size:0.9rem;">シフトを先に追加してください</p>';
      return;
    }

    state.shifts.forEach(function(shift) {
      var btn = document.createElement('button');
      btn.className = 'edit-shift-tab' + (shift.id === state.editingShift ? ' active' : '');
      btn.textContent = shift.name;
      btn.addEventListener('click', function() {
        state.editingShift = shift.id;
        renderEditShiftTabs();
        renderEditList();
      });
      container.appendChild(btn);
    });
  }

  function renderEditList() {
    var container = document.getElementById('editList');
    container.innerHTML = '';

    if (!state.editingShift || !state.items[state.editingShift]) {
      if (state.shifts.length > 0) {
        container.innerHTML = '<p class="empty-state">項目がありません</p>';
      }
      return;
    }

    var shiftItems = state.items[state.editingShift];

    if (shiftItems.length === 0) {
      container.innerHTML = '<p class="empty-state">項目がありません</p>';
      return;
    }

    shiftItems.forEach(function(item, index) {
      var dayLabel = '';
      if (item.date) {
        dayLabel = '毎月' + item.date + '日';
      } else if (item.days && item.days.length > 0) {
        dayLabel = item.days.join('・');
      }

      var li = document.createElement('li');
      li.className = 'edit-list-item';

      var topDiv = document.createElement('div');
      topDiv.className = 'edit-item-top';

      var textSpan = document.createElement('span');
      textSpan.className = 'item-text';
      textSpan.textContent = item.text;
      topDiv.appendChild(textSpan);

      if (dayLabel) {
        var badge = document.createElement('span');
        badge.className = 'day-badge';
        badge.textContent = dayLabel;
        topDiv.appendChild(badge);
      }

      var bottomDiv = document.createElement('div');
      bottomDiv.className = 'edit-item-bottom';

      var moveGroup = document.createElement('div');
      moveGroup.className = 'move-group';

      var upBtn = document.createElement('button');
      upBtn.className = 'move-btn';
      upBtn.textContent = '↑';
      upBtn.setAttribute('aria-label', '上へ移動');
      upBtn.addEventListener('click', function() { moveItem(index, -1); });

      var downBtn = document.createElement('button');
      downBtn.className = 'move-btn';
      downBtn.textContent = '↓';
      downBtn.setAttribute('aria-label', '下へ移動');
      downBtn.addEventListener('click', function() { moveItem(index, 1); });

      moveGroup.appendChild(upBtn);
      moveGroup.appendChild(downBtn);

      var actionGroup = document.createElement('div');
      actionGroup.className = 'action-group';

      var editBtn = document.createElement('button');
      editBtn.className = 'edit-btn';
      editBtn.textContent = '編集';
      editBtn.addEventListener('click', function() { openEditModal(index); });

      var deleteBtn = document.createElement('button');
      deleteBtn.className = 'delete-btn';
      deleteBtn.textContent = '削除';
      deleteBtn.addEventListener('click', function() { deleteItem(index); });

      actionGroup.appendChild(editBtn);
      actionGroup.appendChild(deleteBtn);

      bottomDiv.appendChild(moveGroup);
      bottomDiv.appendChild(actionGroup);

      li.appendChild(topDiv);
      li.appendChild(bottomDiv);
      container.appendChild(li);
    });
  }

  function renderHistory() {
    var container = document.getElementById('historyList');

    if (state.history.length === 0) {
      container.innerHTML = '<div class="no-history">まだ履歴がありません</div>';
      return;
    }

    var html = '';
    var displayHistory = state.history.slice(0, HISTORY_DISPLAY_MAX);

    displayHistory.forEach(function(record) {
      var checkedItems = record.checkedItems || {};
      var ids = Object.keys(checkedItems);
      var totalCount = ids.length;
      var checkedCount = ids.filter(function(id) { return checkedItems[id].checked; }).length;

      var itemsHtml = ids.map(function(id) {
        var item = checkedItems[id];
        return '<li class="' + (item.checked ? 'checked' : '') + '">' +
               (item.checked ? '✓ ' : '− ') + escapeHtml(item.text) + '</li>';
      }).join('');

      var shiftName = record.shiftName || record.shift || '不明';

      html += '<div class="history-item">' +
              '<div class="history-date">' + escapeHtml(record.date) + '</div>' +
              '<div class="history-shift">' + escapeHtml(shiftName) + '</div>' +
              '<div class="history-status">' +
              '<span class="badge ' + (record.allChecked ? 'complete' : 'incomplete') + '">' +
              (record.allChecked ? '完了' : '未完了') + '</span>' +
              '<span class="history-meta">' + checkedCount + '/' + totalCount + ' ・ ' + escapeHtml(record.time) + '</span>' +
              '</div>' +
              '<details class="history-details">' +
              '<summary>詳細を表示</summary>' +
              '<ul>' + itemsHtml + '</ul>' +
              '</details>' +
              '</div>';
    });

    container.innerHTML = html;
  }

  function renderShiftManageList() {
    var container = document.getElementById('shiftManageList');
    container.innerHTML = '';

    if (state.shifts.length === 0) {
      container.innerHTML = '<p class="empty-state">シフトがありません</p>';
      return;
    }

    state.shifts.forEach(function(shift) {
      var li = document.createElement('li');
      li.className = 'shift-manage-item';

      var infoDiv = document.createElement('div');
      infoDiv.className = 'shift-info';

      var nameSpan = document.createElement('div');
      nameSpan.className = 'shift-name';
      nameSpan.textContent = shift.name;

      var timeSpan = document.createElement('div');
      timeSpan.className = 'shift-time';
      timeSpan.textContent = getShiftTimeString(shift);

      infoDiv.appendChild(nameSpan);
      infoDiv.appendChild(timeSpan);

      var actionsDiv = document.createElement('div');
      actionsDiv.className = 'shift-actions';

      var editBtn = document.createElement('button');
      editBtn.className = 'shift-edit-btn';
      editBtn.textContent = '編集';
      editBtn.addEventListener('click', function() { openShiftEditModal(shift.id); });

      var deleteBtn = document.createElement('button');
      deleteBtn.className = 'shift-delete-btn';
      deleteBtn.textContent = '削除';
      deleteBtn.addEventListener('click', function() { openDeleteConfirmModal(shift.id); });

      actionsDiv.appendChild(editBtn);
      actionsDiv.appendChild(deleteBtn);

      li.appendChild(infoDiv);
      li.appendChild(actionsDiv);
      container.appendChild(li);
    });
  }

  // ========================================
  // シフト管理
  // ========================================
  function openShiftModal(editId) {
    state.editingShiftId = editId || null;
    var title = document.getElementById('shiftModalTitle');
    var nameInput = document.getElementById('shiftNameInput');
    var startInput = document.getElementById('shiftStartInput');
    var endInput = document.getElementById('shiftEndInput');

    if (editId) {
      var shift = getShiftById(editId);
      title.textContent = 'シフトを編集';
      nameInput.value = shift ? shift.name : '';
      startInput.value = shift ? shift.startTime : '';
      endInput.value = shift ? shift.endTime : '';
    } else {
      title.textContent = 'シフトを追加';
      nameInput.value = '';
      startInput.value = '';
      endInput.value = '';
    }

    document.getElementById('shiftModal').classList.add('show');
  }

  function closeShiftModal() {
    document.getElementById('shiftModal').classList.remove('show');
    state.editingShiftId = null;
  }

  function saveShift() {
    var nameInput = document.getElementById('shiftNameInput');
    var startInput = document.getElementById('shiftStartInput');
    var endInput = document.getElementById('shiftEndInput');

    var name = nameInput.value.trim();
    if (!name) {
      alert('シフト名を入力してください');
      return;
    }

    if (state.editingShiftId) {
      var shift = getShiftById(state.editingShiftId);
      if (shift) {
        shift.name = name;
        shift.startTime = startInput.value;
        shift.endTime = endInput.value;
        /* FIX: 選択中シフトを編集した場合、メイン画面のヘッダー表示も更新 */
        if (state.currentShift === state.editingShiftId) {
          document.getElementById('currentShiftName').textContent = shift.name;
          document.getElementById('currentShiftTime').textContent = getShiftTimeString(shift);
        }
      }
    } else {
      var newShift = {
        id: generateId(),
        name: name,
        startTime: startInput.value,
        endTime: endInput.value
      };
      state.shifts.push(newShift);
      state.items[newShift.id] = [];
    }

    saveToStorage(STORAGE_KEYS.shifts, state.shifts);
    saveToStorage(STORAGE_KEYS.items, state.items);

    closeShiftModal();
    renderShiftButtons();
    renderEditShiftTabs();
    renderShiftManageList();

    if (!state.editingShift && state.shifts.length > 0) {
      state.editingShift = state.shifts[0].id;
      renderEditShiftTabs();
      renderEditList();
    }
  }

  function openShiftEditModal(shiftId) {
    document.getElementById('manageShiftsModal').classList.remove('show');
    openShiftModal(shiftId);
  }

  function openDeleteConfirmModal(shiftId) {
    var shift = getShiftById(shiftId);
    if (!shift) return;
    state.editingShiftId = shiftId;
    document.getElementById('deleteConfirmText').textContent =
      '「' + shift.name + '」を削除しますか？このシフトの全ての項目も削除されます。';
    document.getElementById('deleteConfirmModal').classList.add('show');
  }

  function closeDeleteConfirmModal() {
    document.getElementById('deleteConfirmModal').classList.remove('show');
    state.editingShiftId = null;
  }

  function deleteShift() {
    if (!state.editingShiftId) return;

    var shiftId = state.editingShiftId;
    state.shifts = state.shifts.filter(function(s) { return s.id !== shiftId; });
    delete state.items[shiftId];

    if (state.currentShift === shiftId) {
      state.currentShift = null;
      saveToStorage(STORAGE_KEYS.currentShift, null);
    }
    if (state.editingShift === shiftId) {
      state.editingShift = state.shifts.length > 0 ? state.shifts[0].id : null;
    }

    saveToStorage(STORAGE_KEYS.shifts, state.shifts);
    saveToStorage(STORAGE_KEYS.items, state.items);

    closeDeleteConfirmModal();
    renderShiftButtons();
    renderEditShiftTabs();
    renderEditList();
    renderShiftManageList();
  }

  // ========================================
  // 項目編集
  // ========================================
  function addItem() {
    if (!state.editingShift) {
      alert('シフトを先に追加してください');
      return;
    }

    var textInput = document.getElementById('newItemText');
    var text = textInput.value.trim();
    if (!text) {
      alert('項目を入力してください');
      return;
    }

    var days = getSelectedDays('newItemDays');
    var dateValue = document.getElementById('newItemDate').value;
    var date = dateValue ? parseInt(dateValue, 10) : null;

    if (date !== null && (isNaN(date) || date < 1 || date > 31)) {
      alert('特定日は1〜31の範囲で入力してください');
      return;
    }
    if (date) days = [];

    if (!state.items[state.editingShift]) state.items[state.editingShift] = [];

    state.items[state.editingShift].push({
      id: generateId(), text: text, days: days, date: date
    });

    saveToStorage(STORAGE_KEYS.items, state.items);

    textInput.value = '';
    document.getElementById('newItemDate').value = '';
    resetDaySelect('newItemDays');
    renderEditList();

    if (state.editingShift === state.currentShift) {
      renderChecklist();
      updateProgress();
    }
  }

  function moveItem(index, direction) {
    var items = state.items[state.editingShift];
    var newIndex = index + direction;
    if (newIndex < 0 || newIndex >= items.length) return;

    var temp = items[index];
    items[index] = items[newIndex];
    items[newIndex] = temp;

    saveToStorage(STORAGE_KEYS.items, state.items);
    renderEditList();
    if (state.editingShift === state.currentShift) renderChecklist();
  }

  function deleteItem(index) {
    state.items[state.editingShift].splice(index, 1);
    saveToStorage(STORAGE_KEYS.items, state.items);
    renderEditList();
    if (state.editingShift === state.currentShift) {
      renderChecklist();
      updateProgress();
    }
  }

  function openEditModal(index) {
    state.editingIndex = index;
    var item = state.items[state.editingShift][index];

    document.getElementById('editItemInput').value = item.text;
    document.getElementById('editItemDate').value = item.date || '';

    var daysContainer = document.getElementById('editItemDays');
    var allDays = ['毎日', '月', '火', '水', '木', '金', '土', '日'];
    daysContainer.innerHTML = '';

    allDays.forEach(function(day) {
      var isChecked = item.days && item.days.indexOf(day) !== -1;
      var label = document.createElement('label');
      var input = document.createElement('input');
      input.type = 'checkbox';
      input.value = day;
      input.checked = isChecked;
      var span = document.createElement('span');
      span.textContent = day;
      label.appendChild(input);
      label.appendChild(span);
      daysContainer.appendChild(label);
    });

    setupDaySelectLogic('editItemDays');
    document.getElementById('editModal').classList.add('show');
  }

  function closeEditModal() {
    document.getElementById('editModal').classList.remove('show');
    state.editingIndex = -1;
  }

  function confirmEdit() {
    var text = document.getElementById('editItemInput').value.trim();
    if (!text) {
      alert('項目を入力してください');
      return;
    }

    var days = getSelectedDays('editItemDays');
    var dateValue = document.getElementById('editItemDate').value;
    var date = dateValue ? parseInt(dateValue, 10) : null;

    if (date !== null && (isNaN(date) || date < 1 || date > 31)) {
      alert('特定日は1〜31の範囲で入力してください');
      return;
    }
    if (date) days = [];

    var item = state.items[state.editingShift][state.editingIndex];
    item.text = text;
    item.days = days;
    item.date = date;

    saveToStorage(STORAGE_KEYS.items, state.items);
    closeEditModal();
    renderEditList();

    if (state.editingShift === state.currentShift) {
      renderChecklist();
      updateProgress();
    }
  }

  // ========================================
  // 曜日選択（選択状態は label.on クラスで表現）
  // ========================================
  function getSelectedDays(containerId) {
    var container = document.getElementById(containerId);
    var checkboxes = container.querySelectorAll('input[type="checkbox"]:checked');
    var days = [];
    checkboxes.forEach(function(cb) { days.push(cb.value); });
    return days;
  }

  function syncDayLabels(containerId) {
    var container = document.getElementById(containerId);
    if (!container) return;
    container.querySelectorAll('input[type="checkbox"]').forEach(function(cb) {
      var label = cb.closest('label');
      if (!label) return;
      label.classList.toggle('on', cb.checked);
    });
  }

  function resetDaySelect(containerId) {
    var container = document.getElementById(containerId);
    container.querySelectorAll('input[type="checkbox"]').forEach(function(cb) {
      cb.checked = (cb.value === '毎日');
    });
    syncDayLabels(containerId);
  }

  function setupDaySelectLogic(containerId) {
    var container = document.getElementById(containerId);
    if (!container) return;

    var checkboxes = container.querySelectorAll('input[type="checkbox"]');
    checkboxes.forEach(function(cb) {
      cb.addEventListener('change', function() {
        if (this.value === '毎日' && this.checked) {
          checkboxes.forEach(function(other) {
            if (other.value !== '毎日') other.checked = false;
          });
        } else if (this.value !== '毎日' && this.checked) {
          var everyday = container.querySelector('input[value="毎日"]');
          if (everyday) everyday.checked = false;
        }
        syncDayLabels(containerId);
      });
    });

    syncDayLabels(containerId);
  }

  // ========================================
  // バックアップ・復元
  // ========================================
  function exportBackup() {
    var backup = {
      version: BACKUP_VERSION,
      exportDate: new Date().toISOString(),
      shifts: state.shifts || [],
      items: state.items || {},
      history: state.history || [],
      todayChecks: state.todayChecks || {},
      currentShift: state.currentShift || null
    };

    var text = JSON.stringify(backup);

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function() {
        showToast('コピーしました');
      }).catch(function() {});
    }

    var modal = document.createElement('div');
    modal.className = 'modal-overlay show';

    var inner = document.createElement('div');
    inner.className = 'modal';

    var title = document.createElement('h3');
    title.textContent = 'バックアップデータ';

    var desc = document.createElement('p');
    desc.style.cssText = 'font-size:0.85rem;color:#8F8D89;margin-bottom:12px;';
    desc.textContent = 'クリップボードにコピーしました';

    var textarea = document.createElement('textarea');
    textarea.readOnly = true;
    /* font-size 16px 厳守：11px等にするとiOSがフォーカス時に強制ズームする */
    textarea.style.cssText = 'width:100%;height:160px;font-size:16px;line-height:1.5;padding:12px;border:1.5px solid #E4E2DD;border-radius:10px;background:#F4F3F0;color:#16181A;font-family:inherit;-webkit-user-select:text;user-select:text;';
    textarea.value = text;

    var copyBtn = document.createElement('button');
    copyBtn.className = 'modal-confirm';
    copyBtn.style.cssText = 'width:100%;margin-top:14px;padding:15px;border:none;border-radius:10px;font-family:inherit;font-weight:700;cursor:pointer;';
    copyBtn.textContent = 'もう一度コピー';
    copyBtn.onclick = function() {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function() { showToast('コピーしました'); });
      } else {
        textarea.select();
        document.execCommand('copy');
        showToast('コピーしました');
      }
    };

    var closeBtn = document.createElement('button');
    closeBtn.className = 'modal-cancel';
    closeBtn.style.cssText = 'width:100%;margin-top:8px;padding:15px;border:none;border-radius:10px;font-family:inherit;font-weight:700;cursor:pointer;';
    closeBtn.textContent = '閉じる';
    closeBtn.onclick = function() { modal.remove(); };

    inner.appendChild(title);
    inner.appendChild(desc);
    inner.appendChild(textarea);
    inner.appendChild(copyBtn);
    inner.appendChild(closeBtn);
    modal.appendChild(inner);
    document.body.appendChild(modal);
  }

  function showToast(message) {
    var toast = document.createElement('div');
    toast.style.cssText = 'position:fixed;top:calc(20px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#16181A;color:#fff;padding:12px 26px;border-radius:24px;z-index:1000;font-weight:600;font-size:0.88rem;box-shadow:0 8px 24px rgba(22,24,26,0.3);';
    toast.textContent = message;
    document.body.appendChild(toast);
    setTimeout(function() {
      toast.style.transition = 'opacity 0.3s';
      toast.style.opacity = '0';
      setTimeout(function() { toast.remove(); }, 320);
    }, 1500);
  }

  function showRestoreModal() {
    var modal = document.createElement('div');
    modal.className = 'modal-overlay show';

    var inner = document.createElement('div');
    inner.className = 'modal';

    var title = document.createElement('h3');
    title.textContent = 'バックアップから復元';

    var desc = document.createElement('p');
    desc.style.cssText = 'font-size:0.85rem;color:#8F8D89;margin-bottom:12px;';
    desc.textContent = 'バックアップデータを貼り付けてください';

    var textarea = document.createElement('textarea');
    textarea.placeholder = 'ここに貼り付け';
    /* font-size 16px 厳守（iOSズーム防止） */
    textarea.style.cssText = 'width:100%;height:150px;font-size:16px;line-height:1.5;padding:12px;border:1.5px solid #E4E2DD;border-radius:10px;background:#F4F3F0;color:#16181A;font-family:inherit;box-sizing:border-box;';

    var btnContainer = document.createElement('div');
    btnContainer.className = 'modal-buttons';

    var cancelBtn = document.createElement('button');
    cancelBtn.type = 'button';
    cancelBtn.className = 'modal-cancel';
    cancelBtn.textContent = 'キャンセル';
    cancelBtn.onclick = function() { modal.remove(); };

    var restoreBtn = document.createElement('button');
    restoreBtn.type = 'button';
    restoreBtn.className = 'modal-confirm';
    restoreBtn.textContent = '復元する';
    restoreBtn.onclick = function() {
      var text = textarea.value.trim();
      if (!text) {
        alert('バックアップデータを貼り付けてください');
        return;
      }
      restoreBackup(text, modal);
    };

    btnContainer.appendChild(cancelBtn);
    btnContainer.appendChild(restoreBtn);

    inner.appendChild(title);
    inner.appendChild(desc);
    inner.appendChild(textarea);
    inner.appendChild(btnContainer);
    modal.appendChild(inner);
    document.body.appendChild(modal);
  }

  function restoreBackup(text, modal) {
    try {
      var cleanText = text.trim();
      cleanText = cleanText.replace(/[\u201C\u201D]/g, '"');
      cleanText = cleanText.replace(/[\u2018\u2019]/g, "'");
      if (cleanText.charCodeAt(0) === 0xFEFF) cleanText = cleanText.slice(1);

      var backup = JSON.parse(cleanText);

      if (!backup.shifts && !backup.items) {
        alert('無効なバックアップデータです');
        return;
      }

      /* 旧形式バックアップ（shifts配列なし・itemsのキーがシフト名）を自動変換 */
      if (!backup.shifts && backup.items) {
        var legacyTimes = { '超早': ['07:00','16:00'], '早番': ['09:00','18:00'], '中番': ['11:00','20:00'], '遅番': ['14:30','23:30'] };
        var convertedShifts = [];
        var convertedItems = {};
        Object.keys(backup.items).forEach(function(name) {
          var sid = 'shift_' + Math.random().toString(36).slice(2, 8);
          /* 既知のシフト名は固定IDを使用（重複復元でもIDが安定） */
          if (name === '超早') sid = 'shift_choso';
          if (name === '早番') sid = 'shift_haya';
          if (name === '中番') sid = 'shift_naka';
          if (name === '遅番') sid = 'shift_oso';
          var t = legacyTimes[name] || ['', ''];
          convertedShifts.push({ id: sid, name: name, startTime: t[0], endTime: t[1] });
          convertedItems[sid] = backup.items[name];
          if (backup.currentShift === name) backup.currentShift = sid;
        });
        backup.shifts = convertedShifts;
        backup.items = convertedItems;
      }

      state.shifts = backup.shifts || [];
      state.items = backup.items || {};
      state.history = backup.history || [];
      state.todayChecks = backup.todayChecks || {};

      saveToStorage(STORAGE_KEYS.shifts, state.shifts);
      saveToStorage(STORAGE_KEYS.items, state.items);
      saveToStorage(STORAGE_KEYS.history, state.history);
      saveToStorage(STORAGE_KEYS.todayChecks, state.todayChecks);

      if (backup.currentShift && state.shifts.some(function(s) { return s.id === backup.currentShift; })) {
        state.currentShift = backup.currentShift;
        saveToStorage(STORAGE_KEYS.currentShift, state.currentShift);
      }

      state.editingShift = state.shifts.length > 0 ? state.shifts[0].id : null;

      renderShiftButtons();
      renderEditShiftTabs();
      renderEditList();
      renderHistory();

      if (state.currentShift) {
        renderChecklist();
        updateProgress();
        updateCompletedState();
      }

      modal.remove();
      showToast('復元が完了しました');

    } catch (e) {
      console.error('restore error:', e);
      alert('データの形式が正しくありません。\nコピーし直してもう一度お試しください。');
    }
  }

  function resetHistory() {
    var modal = document.createElement('div');
    modal.className = 'modal-overlay show';

    var inner = document.createElement('div');
    inner.className = 'modal';
    inner.style.textAlign = 'center';

    var title = document.createElement('h3');
    title.style.color = '#B3261E';
    title.textContent = '履歴を削除';

    var msg = document.createElement('p');
    msg.style.cssText = 'font-size:0.9rem;color:#8F8D89;margin-bottom:20px;';
    msg.textContent = 'すべての履歴が削除されます。この操作は取り消せません。';

    var btnContainer = document.createElement('div');
    btnContainer.className = 'modal-buttons';

    var cancelBtn = document.createElement('button');
    cancelBtn.type = 'button';
    cancelBtn.className = 'modal-cancel';
    cancelBtn.textContent = 'キャンセル';
    cancelBtn.onclick = function() { modal.remove(); };

    var confirmBtn = document.createElement('button');
    confirmBtn.type = 'button';
    confirmBtn.className = 'modal-confirm modal-danger';
    confirmBtn.textContent = '削除する';
    confirmBtn.onclick = function() {
      state.history = [];
      saveToStorage(STORAGE_KEYS.history, state.history);
      renderHistory();
      updateCompletedState();
      modal.remove();
      showToast('履歴を削除しました');
    };

    btnContainer.appendChild(cancelBtn);
    btnContainer.appendChild(confirmBtn);
    inner.appendChild(title);
    inner.appendChild(msg);
    inner.appendChild(btnContainer);
    modal.appendChild(inner);
    document.body.appendChild(modal);
  }

  // ========================================
  // シフト選択・タブ
  // ========================================
  function selectShift(shiftId) {
    state.currentShift = shiftId;
    state.editingShift = shiftId;
    saveToStorage(STORAGE_KEYS.currentShift, shiftId);

    var shift = getShiftById(shiftId);
    document.getElementById('currentShiftName').textContent = shift ? shift.name : '';
    document.getElementById('currentShiftTime').textContent = shift ? getShiftTimeString(shift) : '';

    document.getElementById('shiftSelectScreen').style.display = 'none';
    document.getElementById('mainScreen').classList.add('active');

    /* FIX: シフトを選び直したら必ず「チェック」タブから開始する */
    document.querySelectorAll('.tab').forEach(function(t) {
      t.classList.toggle('active', t.getAttribute('data-tab') === 'check');
    });
    document.querySelectorAll('.panel').forEach(function(p) {
      p.classList.remove('active');
    });
    document.getElementById('checkPanel').classList.add('active');

    renderChecklist();
    renderEditShiftTabs();
    renderEditList();
    updateProgress();
    updateCompletedState();
  }

  function changeShift() {
    document.getElementById('shiftSelectScreen').style.display = 'block';
    document.getElementById('mainScreen').classList.remove('active');
  }

  function setupTabs() {
    var tabs = document.querySelectorAll('.tab');
    tabs.forEach(function(tab) {
      tab.addEventListener('click', function() {
        var tabName = this.getAttribute('data-tab');
        tabs.forEach(function(t) { t.classList.remove('active'); });
        this.classList.add('active');
        document.querySelectorAll('.panel').forEach(function(panel) {
          panel.classList.remove('active');
        });
        document.getElementById(tabName + 'Panel').classList.add('active');
      });
    });
  }

  // ========================================
  // イベント
  // ========================================
  function setupEventListeners() {
    document.getElementById('addShiftBtn').addEventListener('click', function() { openShiftModal(); });
    document.getElementById('manageShiftsBtn').addEventListener('click', function() {
      renderShiftManageList();
      document.getElementById('manageShiftsModal').classList.add('show');
    });
    document.getElementById('shiftModalCancel').addEventListener('click', closeShiftModal);
    document.getElementById('shiftModalConfirm').addEventListener('click', saveShift);
    document.getElementById('manageShiftsClose').addEventListener('click', function() {
      document.getElementById('manageShiftsModal').classList.remove('show');
    });
    document.getElementById('deleteConfirmCancel').addEventListener('click', closeDeleteConfirmModal);
    document.getElementById('deleteConfirmOk').addEventListener('click', deleteShift);
    document.getElementById('changeShiftBtn').addEventListener('click', changeShift);
    document.getElementById('undoCompleteBtn').addEventListener('click', undoComplete);
    document.getElementById('completeBtn').addEventListener('click', completeCheck);
    document.getElementById('addItemBtn').addEventListener('click', addItem);
    document.getElementById('editModalCancel').addEventListener('click', closeEditModal);
    document.getElementById('editModalConfirm').addEventListener('click', confirmEdit);
    document.getElementById('exportBackupBtn').addEventListener('click', exportBackup);
    document.getElementById('showRestoreBtn').addEventListener('click', showRestoreModal);
    document.getElementById('resetHistoryBtn').addEventListener('click', resetHistory);

    setupTabs();
    setupDaySelectLogic('newItemDays');

    document.addEventListener('visibilitychange', function() {
      if (!document.hidden && checkDateChange()) {
        updateDateDisplay();
        renderChecklist();
        updateProgress();
        updateCompletedState();
        renderHistory();
      }
    });
  }

  // ========================================
  // 初期化
  // ========================================
  function init() {
    state.shifts = loadFromStorage(STORAGE_KEYS.shifts, []);
    state.items = loadFromStorage(STORAGE_KEYS.items, {});

    /* 初回起動時（シフト未登録）は標準の4シフト＋業務項目を自動セット。
       既にデータがある端末には影響しない */
    if (state.shifts.length === 0) {
      state.shifts = JSON.parse(JSON.stringify(DEFAULT_SHIFTS));
      state.items = JSON.parse(JSON.stringify(DEFAULT_ITEMS));
      saveToStorage(STORAGE_KEYS.shifts, state.shifts);
      saveToStorage(STORAGE_KEYS.items, state.items);
    }
    state.todayChecks = loadFromStorage(STORAGE_KEYS.todayChecks, {});
    state.history = loadFromStorage(STORAGE_KEYS.history, []);
    state.currentShift = loadFromStorage(STORAGE_KEYS.currentShift, null);
    state.editingShift = state.shifts.length > 0 ? state.shifts[0].id : null;

    if (checkDateChange()) {
      state.todayChecks = {};
    }

    updateDateDisplay();
    renderShiftButtons();

    if (state.currentShift && getShiftById(state.currentShift)) {
      var shift = getShiftById(state.currentShift);
      document.getElementById('currentShiftName').textContent = shift.name;
      document.getElementById('currentShiftTime').textContent = getShiftTimeString(shift);
      document.getElementById('shiftSelectScreen').style.display = 'none';
      document.getElementById('mainScreen').classList.add('active');
      state.editingShift = state.currentShift;
    }

    renderChecklist();
    renderEditShiftTabs();
    renderEditList();
    renderHistory();
    updateProgress();
    updateCompletedState();
    setupEventListeners();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})();
</script>
